<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0C14"/>
      <stop offset="50%" stop-color="#181326"/>
      <stop offset="100%" stop-color="#2D123D"/>
    </linearGradient>
    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA03A"/>
      <stop offset="100%" stop-color="#FF4A6B"/>
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A2BE2"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#FFA03A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#bgGrad)" rx="32"/>

  <!-- Geometric Grid Pattern Overlay -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1.5">
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="450" x2="600" y2="450"/>
    <line x1="150" y1="0" x2="150" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="450" y1="0" x2="450" y2="600"/>
  </g>

  <!-- Glowing Aura Circle -->
  <circle cx="300" cy="240" r="140" fill="none" stroke="url(#neonOrange)" stroke-width="3" filter="url(#glow)"/>
  <circle cx="300" cy="240" r="120" fill="#121624" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>

  <!-- Stylized Portrait Silhouette / Camera Icon Motif -->
  <!-- Head & Shoulders silhouette -->
  <path d="M 230 340 C 230 280, 370 280, 370 340 Z" fill="url(#neonPurple)" opacity="0.8"/>
  <circle cx="300" cy="210" r="55" fill="url(#neonOrange)"/>
  
  <!-- Creative / Camera Lens badge -->
  <circle cx="300" cy="210" r="30" fill="#0A0C14"/>
  <circle cx="300" cy="210" r="18" fill="url(#neonOrange)"/>
  <circle cx="306" cy="204" r="6" fill="#FFFFFF"/>

  <!-- Film Clapper / Director motif accent -->
  <path d="M 330 290 L 370 250 L 390 270 L 350 310 Z" fill="#FFA03A" opacity="0.9"/>

  <!-- Badge banner -->
  <rect x="180" y="385" width="240" height="34" rx="17" fill="#1A1F30" stroke="url(#neonOrange)" stroke-width="1.5"/>
  <text x="300" y="407" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFA03A" text-anchor="middle" letter-spacing="2">
    PHOTO: IMG-2026
  </text>

  <!-- Text Details -->
  <text x="300" y="465" font-family="'Space Grotesk', system-ui, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF" text-anchor="middle">
    Arpit Tiwari
  </text>
  <text x="300" y="500" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#FFA03A" text-anchor="middle">
    Founder • Creative Director • Age 17
  </text>
  <text x="300" y="530" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8" text-anchor="middle">
    Chhiwla Lauwa, Rewa, MP • +91 8085842137
  </text>
</svg>
