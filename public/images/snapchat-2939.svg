<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="sanskarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0C14"/>
      <stop offset="50%" stop-color="#0E1A33"/>
      <stop offset="100%" stop-color="#142850"/>
    </linearGradient>
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#8A2BE2"/>
    </linearGradient>
    <filter id="sanskarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0066FF" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#sanskarBg)" rx="32"/>

  <!-- Geometric Grid Pattern Overlay -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1.5">
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="450" x2="600" y2="450"/>
    <line x1="150" y1="0" x2="150" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="450" y1="0" x2="450" y2="600"/>
  </g>

  <!-- Glowing Aura Circle -->
  <circle cx="300" cy="240" r="140" fill="none" stroke="url(#neonBlue)" stroke-width="3" filter="url(#sanskarGlow)"/>
  <circle cx="300" cy="240" r="120" fill="#0D1322" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>

  <!-- Stylized Portrait Silhouette / Fitness Gym motif -->
  <!-- Head & athletic shoulders silhouette -->
  <path d="M 210 345 C 210 270, 390 270, 390 345 Z" fill="url(#neonCyan)" opacity="0.85"/>
  <circle cx="300" cy="205" r="55" fill="url(#neonBlue)"/>

  <!-- Gym Dumbbell / Fitness Strength Icon Overlay -->
  <g transform="translate(300, 290)">
    <rect x="-40" y="-7" width="80" height="14" rx="4" fill="#0A0C14" stroke="#00F0FF" stroke-width="2"/>
    <rect x="-48" y="-18" width="16" height="36" rx="4" fill="#0066FF"/>
    <rect x="32" y="-18" width="16" height="36" rx="4" fill="#0066FF"/>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
  </g>

  <!-- Badge banner -->
  <rect x="150" y="385" width="300" height="34" rx="17" fill="#121D33" stroke="url(#neonBlue)" stroke-width="1.5"/>
  <text x="300" y="407" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" font-weight="700" fill="#00F0FF" text-anchor="middle" letter-spacing="2">
    PHOTO: SNAPCHAT-2939 • GYM ENTHUSIAST
  </text>

  <!-- Text Details -->
  <text x="300" y="465" font-family="'Space Grotesk', system-ui, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF" text-anchor="middle">
    Sanskar Tiwari
  </text>
  <text x="300" y="500" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#38BDF8" text-anchor="middle">
    Co-Founder &amp; CEO • Age 16 • Fitness &amp; Growth
  </text>
  <text x="300" y="530" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8" text-anchor="middle">
    Ward No. 6, Baikunthpur, Rewa, MP (SYNTHIC HQ)
  </text>
</svg>
